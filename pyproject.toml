[project]
name = "lean-harness-continuity"
version = "0.1.0"
description = "Project-shared work events and per-worktree recovery"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["continuity/tests"]
pythonpath = ["continuity"]
