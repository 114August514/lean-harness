[project]
name = "lean-harness-git-mcp"
version = "0.1.0"
description = "Local Git MCP capability for Lean Harness"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
