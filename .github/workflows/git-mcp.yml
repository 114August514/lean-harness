name: git-mcp

on:
  push:
    branches: [main]
    paths:
      - git-mcp/**
      - .github/workflows/git-mcp.yml
  pull_request:
    paths:
      - git-mcp/**
      - .github/workflows/git-mcp.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: git-mcp
      - run: uv run pytest -q
        working-directory: git-mcp
      - run: uv run ruff check .
        working-directory: git-mcp
      - run: uv run ruff format --check .
        working-directory: git-mcp
