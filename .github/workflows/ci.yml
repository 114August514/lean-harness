name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group dev || uv sync --group dev || true

      - name: Doctor Baseline Check
        run: make doctor

      - name: Standard Gate Check (Unit Tests, Tooling Scaffolding Tests, Lint, Format)
        run: make check

      - name: Automated Change Audit
        run: make audit
