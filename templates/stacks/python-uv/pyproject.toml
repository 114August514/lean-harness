[project]
name = "lean-app"
version = "0.1.0"
description = "Lean Harness Project"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Exact versions keep the scaffold's make check reproducible; bump deliberately.
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
